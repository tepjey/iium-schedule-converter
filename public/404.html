<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found – SlipSnap</title>
    <!-- Served for any missing path, so links must be absolute. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f3f5f3;
        color: #0d2f2e;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
        text-align: center;
      }
      main { max-width: 26rem; }
      svg { width: 56px; height: 56px; }
      h1 { margin: 20px 0 8px; font-size: 1.75rem; line-height: 1.2; }
      p { margin: 0; color: #5a6d6a; }
      .home {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 18px;
        border-radius: 8px;
        background: #0f6b66;
        color: #f3f5f3;
        font-weight: 600;
        text-decoration: none;
      }
      .home:hover { background: #0b524e; }
      .report { margin-top: 20px; font-size: 0.875rem; }
      .report a { color: #0f6b66; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="-50 -50 100 100" aria-hidden="true">
        <rect x="-50" y="-50" width="100" height="100" rx="22" fill="#0f6b66" />
        <g fill="none" stroke="#f3f5f3" stroke-width="7" stroke-linejoin="round">
          <rect x="-24" y="-24" width="48" height="48" />
          <rect x="-24" y="-24" width="48" height="48" transform="rotate(45)" />
        </g>
      </svg>
      <h1>This page doesn’t exist</h1>
      <p>The link may be old or mistyped. SlipSnap lives on a single page.</p>
      <a class="home" href="/">Go to SlipSnap</a>
      <p class="report">
        Followed a link here from the site?
        <a href="https://github.com/tepjey/iium-schedule-converter/issues/new?template=report-a-problem.yml" target="_blank" rel="noreferrer">Report it on GitHub</a>
      </p>
    </main>
  </body>
</html>
